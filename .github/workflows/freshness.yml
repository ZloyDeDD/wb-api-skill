name: freshness

# Напоминание мейнтейнеру, что пора синкать снимок. Issues намеренно не
# заводятся: красный прогон и письмо от GitHub видит владелец репозитория,
# а посторонним в Issues видеть нечего.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install -r requirements.txt

      - name: Возраст снимка
        run: python scripts/wb.py stale --fail-if-stale
